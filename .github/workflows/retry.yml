name: Oracle Cloud Instance Auto-Retry

on:
  workflow_dispatch: # Manual-aa Run button click panna
  schedule:
    - cron: '*/30 * * * *' # Every 30 mins automatically re-checks

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Runs up to 5.5 hours continuously

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OCI SDK
        run: |
          pip install oci

      - name: Run Auto-Provision Script
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_AD_NAME: ${{ secrets.OCI_AD_NAME }}
        run: |
          cat << 'EOF' > launch.py
          import os
          import time
          import oci

          # Setup OCI Configuration
          key_path = "/tmp/oci_api_key.pem"
          with open(key_path, "w") as f:
            f.write(os.environ["OCI_KEY_CONTENT"].strip())

          config = {
              "user": os.environ["OCI_USER"],
              "key_file": key_path,
              "fingerprint": os.environ["OCI_FINGERPRINT"],
              "tenancy": os.environ["OCI_TENANCY"],
              "region": os.environ["OCI_REGION"]
          }

          oci.config.validate_config(config)
          compute_client = oci.core.ComputeClient(config)

          # Instance Launch Details (2 OCPU & 12 GB RAM - Always Free)
          launch_details = oci.core.models.LaunchInstanceDetails(
              compartment_id=os.environ["OCI_TENANCY"],
              availability_domain=os.environ["OCI_AD_NAME"],
              display_name="AJCarvio",
              shape="VM.Standard.A1.Flex",
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                  ocpus=2.0,
                  memory_in_gbs=12.0
              ),
              source_details=oci.core.models.InstanceSourceViaBootVolumeDetails(
                  source_type="bootVolume",
                  boot_volume_id=os.environ["OCI_BOOT_VOLUME_ID"]
              ),
              create_vnic_details=oci.core.models.CreateVnicDetails(
                  subnet_id=os.environ["OCI_SUBNET_ID"],
                  assign_public_ip=True,
                  assign_private_dns_record=True
              ),
              is_pv_encryption_in_transit_enabled=True
          )

          print("==================================================")
          print("🚀 Starting Oracle Instance Auto-Retry Loop...")
          print("Target: 2 OCPUs, 12 GB RAM with Old Boot Volume")
          print("==================================================")

          attempt = 1
          while True:
              try:
                  print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] Attempt #{attempt}: Requesting instance creation...")
                  response = compute_client.launch_instance(launch_details)
                  
                  if response.status == 200:
                      instance_id = response.data.id
                      print("\n🎉 ===============================================")
                      print("🎉 SUCCESS! INSTANCE CREATED SUCCESSFULLY!")
                      print(f"🎉 Instance ID: {instance_id}")
                      print("🎉 ===============================================\n")
                      break
              except oci.exceptions.ServiceError as e:
                  if "Out of host capacity" in e.message or "OutOfCapacity" in e.code or e.status == 500:
                      print(f"⚠️ Capacity unavailable (Out of capacity). Retrying in 45s...")
                  else:
                      print(f"❌ Oracle API Error [{e.code} - {e.status}]: {e.message}")
              except Exception as err:
                  print(f"❌ Unexpected error: {err}")
              
              attempt += 1
              time.sleep(45)

          EOF
          python launch.py
